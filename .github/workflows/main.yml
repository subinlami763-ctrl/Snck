      if ($j.style) { $style = "$($j.style)" }
      if ($j.tile) { $tile = "$($j.tile)" }
     }
     $d = "HKCU:\Control Panel\Desktop"
     Set-ItemProperty -Path $d -Name WallpaperStyle -Value $style
     Set-ItemProperty -Path $d -Name TileWallpaper -Value $tile
     Add-Type -TypeDefinition 'using System.Runtime.InteropServices; public class SnckWP { [DllImport("user32.dll", CharSet=CharSet.Auto)] public static extern int SystemParametersInfo(int a, int b, string c, int d); }'
     for ($i = 0; $i -lt 3; $i++) {
      [SnckWP]::SystemParametersInfo(20, 0, $wp.FullName, 3) | Out-Null
      Start-Sleep -Seconds 5
     }
     '@ | Set-Content -Path "C:\ProgramData\snck-wallpaper.ps1"
     Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run" -Name "SnckWallpaper" -Value 'powershell.exe -NoProfile -WindowStyle Hidden -ExecutionPolicy Bypass -File "C:\ProgramData\snck-wallpaper.ps1"'
     Write-Host "Wallpaper logon script ready."
