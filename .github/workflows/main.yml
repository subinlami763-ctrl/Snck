  - name: Establish Tailscale Connection
    run: |
     $ErrorActionPreference = "Continue"
     $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
     if (-not (Test-Path $ts)) { Write-Error "tailscale.exe nahi mila"; exit 1 }
     function Get-TsIp {
      try {
       $st = (cmd /c "`"$ts`" status --json 2>nul") | Out-String | ConvertFrom-Json
       if ($st.BackendState -eq "Running" -and $st.TailscaleIPs) {
        return @($st.TailscaleIPs | Where-Object { $_ -match '^\d+\.\d+\.\d+\.\d+$' })[0]
       }
      } catch {}
      return $null
     }
     $tsIP = $null
     for ($i = 0; $i -lt 15 -and -not $tsIP; $i++) {
      $tsIP = Get-TsIp
      if (-not $tsIP) { Start-Sleep -Seconds 3 }
     }
     if ($tsIP) {
      Write-Host "Saved login chal gaya. IP: $tsIP"
     } else {
      Write-Host "Saved login expire/invalid, naya login link bana rahe hain..."
      $out = "$env:TEMP\ts_out.txt"; $err = "$env:TEMP\ts_err.txt"
      Remove-Item $out, $err -Force -ErrorAction SilentlyContinue
      $p = Start-Process $ts -ArgumentList "up","--unattended","--reset","--force-reauth","--accept-dns=false","--hostname=snck-rdp" `
       -RedirectStandardOutput $out -RedirectStandardError $err -NoNewWindow -PassThru
      $link = $null; $text = ""
      for ($i = 0; $i -lt 60 -and -not $link; $i++) {
       Start-Sleep -Seconds 2
       $text = "$(Get-Content $out -Raw -ErrorAction SilentlyContinue)`n$(Get-Content $err -Raw -ErrorAction SilentlyContinue)"
       if ($text -match 'https://login\.tailscale\.com/\S+') { $link = $Matches[0] }
       elseif ($p.HasExited) { break }
      }
      if ($link) {
       Write-Host "`n=============================="
       Write-Host " TAILSCALE LOGIN LINK:"
       Write-Host " $link"
       Write-Host "==============================`n"
      } else {
       Write-Host "---- tailscale output ----"; Write-Host $text
       & $ts status
      }
      for ($i = 0; $i -lt 120 -and -not $tsIP; $i++) {
       Start-Sleep -Seconds 5
       $tsIP = Get-TsIp
      }
      if (-not $tsIP) { Write-Host "Login nahi hua, IP nahi mila"; exit 1 }
     }
     echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
     Start-Sleep -Seconds 2
     if (Test-Path "C:\save-ts.ps1") { & "C:\save-ts.ps1" }
     exit 0
  - name: Network Latency Tweaks
    run: |
     $ErrorActionPreference = "Continue"
     try {
      $ifs = "HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters\Interfaces"
      foreach ($i in @(Get-ChildItem $ifs -ErrorAction SilentlyContinue)) {
       Set-ItemProperty -Path $i.PSPath -Name "TcpAckFrequency" -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue
       Set-ItemProperty -Path $i.PSPath -Name "TCPNoDelay" -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue
      }
      Write-Host "TCP low-latency settings applied."
     } catch { Write-Host "TCP tweak fail: $_" }
     try { & "$env:ProgramFiles\Tailscale\tailscale.exe" status } catch {}
     exit 0
  - name: Verify RDP Accessibility
    run: |
     Write-Host "Tailscale IP: $env:TAILSCALE_IP"
     $ok = $false
     for ($i = 0; $i -lt 5 -and -not $ok; $i++) {
      $ok = (Test-NetConnection -ComputerName 127.0.0.1 -Port 3389 -WarningAction SilentlyContinue).TcpTestSucceeded
      if (-not $ok) { Start-Sleep -Seconds 3 }
     }
     if (-not $ok) {
      Write-Error "RDP port 3389 not listening"
      exit 1
     }
     Write-Host "RDP port 3389 up!"
  - name: Make Sure Chrome Is Installed (background)
    run: |
     @'
     $ErrorActionPreference = "Continue"
     function Log($m) { "[$(Get-Date -Format T)] $m" | Add-Content "C:\bg-install.log" }
     $c64 = "C:\Program Files\Google\Chrome\Application\chrome.exe"
     $c32 = "C:\Program Files (x86)\Google\Chrome\Application\chrome.exe"
     if ((Test-Path $c64) -or (Test-Path $c32)) { Log "Chrome already present, skip" }
     else {
      Log "installing chrome"
      choco install googlechrome -y --no-progress 2>&1 | Out-File "C:\bg-choco-chrome.log"
      Log "chrome exit: $LASTEXITCODE"
     }
     & "C:\make-shortcuts.ps1" | Out-Null
     Log "bg install done"
     '@ | Set-Content -Path "C:\bg-install.ps1"
     Start-Process powershell.exe -WindowStyle Hidden -ArgumentList "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "C:\bg-install.ps1"
     Write-Host "Chrome check background me shuru, RDP ready hai."
  - name: Maintain Connection
    timeout-minutes: 340
    run: |
     Write-Host "`n=== RDP ACCESS ==="
     Write-Host "Address: $env:TAILSCALE_IP"
     Write-Host "Username: $env:RDP_USER"
     Write-Host "Password: $env:RDP_PASS"
     Write-Host "==================`n"
     try { (Get-Process -Id $PID).PriorityClass = "BelowNormal" } catch {}
     $n = 0
     while ($true) {
      Write-Host "[$(Get-Date)] RDP Active"
      if (($n -lt 15) -and (Test-Path "C:\bg-install.log")) { Get-Content "C:\bg-install.log" -Tail 2 | ForEach-Object { Write-Host "  bg: $_" } }
      Start-Sleep -Seconds 60
      $n++
      if (Test-Path "C:\RDPData\Desktop\save-now.txt") {
       Remove-Item "C:\RDPData\Desktop\save-now.txt" -Force -ErrorAction SilentlyContinue
       Write-Host "save-now.txt mila, abhi full save kar rahe hain"
       if (Test-Path "C:\save-apps.ps1") { & "C:\save-apps.ps1" }
       & "C:\save-data.ps1"
      }
      if ($n % 10 -eq 0 -and (Test-Path "C:\save-apps.ps1")) { & "C:\save-apps.ps1" }
      if ($n % 15 -eq 0) { & "C:\save-data.ps1" }
     }
  - name: Final Save (cancel par bhi chalega)
    if: always()
    run: |
     $names = "chrome","msedge","firefox","brave","opera","vivaldi","Code","Antigravity","Discord","DiscordPTB","DiscordCanary","Update","Telegram","Spotify","slack","notepad++","Unity Hub","Unity"
     Get-Process -Name $names -ErrorAction SilentlyContinue | ForEach-Object { $_.CloseMainWindow() | Out-Null }
     Start-Sleep -Seconds 6
     Get-Process -Name $names -ErrorAction SilentlyContinue | Stop-Process -Force
     Start-Sleep -Seconds 2
     if (Test-Path "C:\save-apps.ps1") { & "C:\save-apps.ps1" }
     if (Test-Path "C:\save-data.ps1") { & "C:\save-data.ps1" }
     exit 0
